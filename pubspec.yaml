  # flutter_audio_waveforms: ^1.2.1+8

  firebase_crashlytics: 5.0.4  
  firebase_analytics: 12.0.4
  carousel_slider: 5.1.2

  # inject_js: ^2.0.0
  # web_ffi: ^0.7.2
dependency_overrides:
  http: ^0.13.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
