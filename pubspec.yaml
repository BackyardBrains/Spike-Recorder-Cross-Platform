# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # record: 6.0.0
  native_add:
    path : native_implementation/pluggins/native_add/
  # processing_plugin:
  #   path : native_implementation/pluggins/processing_plugin/
  processing_ffi:
    path : native_implementation/pluggins/processing_ffi/
  nwbfile_plugin:
    path : native_implementation/pluggins/nwbfile_plugin/

  mic_stream:
    path : native_implementation/pluggins/mic_stream/

  flutter_audio_waveforms:
    path : native_implementation/pluggins/flutter_audio_waveforms1.1.1.3/
  flutter_soloud: 3.2.7
  # file_picker: 10.3.3
  file_picker: 9.2.3
  panara_dialogs: 0.1.5
  flutter_file_saver: 0.9.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  # syncfusion_flutter_charts: ^28.2.4+1
  http: ^1.1.0
  isolated_worker: ^0.1.1
  usb_serial: ^0.5.2
  permission_handler: ^11.0.0
  # flutter_libserialport: ^0.5.0
