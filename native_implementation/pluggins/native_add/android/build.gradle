plugins {
    id 'com.android.library'
}

group 'com.example.native_add'
version '1.0'

android {
    namespace 'com.example.native_add'
    
    // Bumping compileSdk requires clients to match this in their app
    compileSdk 35

    // NDK version matches your requirement for 16KB page size support
    ndkVersion "28.2.13676358"

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path "../src/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 25
        
        // If you need specific C++ standards, define them here
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    // Recommended for native plugins targeting modern Android (Pixel 9+ support)
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}