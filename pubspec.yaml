    git:
      url: https://github.com/salah-taha/flutter_libserialport  
  serial: ^0.0.4
  squadron: ^6.2.0
  isolate_manager: ^5.7.2+1
  wasm_interop: ^2.0.1
  provider: ^6.0.5
  path_provider: ^2.1.1
  url_launcher: ^6.1.14
  ffi: ^2.1.0
  just_audio: ^0.9.35
  # flutter_recorder: 1.1.2 NOT WORKING
  # record: 6.1.2 # WINDOWS ONLY
  audio_session: ^0.1.16
  # flutter_soloud: ^1.2.4
  fps_widget: ^1.0.1+2
  # mic_stream: ^0.7.2
  sound_stream_now: 1.0.0
  serial_communication: ^0.0.2
  another_xlider: 3.0.2
  dotted_line: 3.2.3
  dropdown_button2: 2.3.9
  tabbed_view: 1.22.1
  # super_context_menu: 0.9.1
  # stacked_trio_carousel: ^1.2.1
  # card_slider: ^1.0.6
  # https://pub.dev/packages/card_swiper
  # banner_carousel: ^1.2.1

  window_manager: 0.3.6
  flutter_svg: 2.1.0
  # flutter_recorder: 1.1.1 # it is slow
