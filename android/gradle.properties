org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
org.gradle.java.home=/Users/macbook/Library/Java/JavaVirtualMachines/corretto-18.0.2/Contents/Home
android.suppressUnsupportedCompileSdk=35
# Suppress NDK minSdkVersion error for plugins that haven't updated their minSdkVersion
# NDK 28+ requires minSdk 21+, but some plugins still declare lower versions
android.ndk.suppressMinSdkVersionError=21
# Note: android.bundle.enableUncompressedNativeLibs was removed in AGP 8.1+
# AGP 8.5.1+ automatically handles 16KB page size alignment

# Performance optimizations to prevent hangs
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.daemon=false
org.gradle.workers.max=1

# Disable instrumentation transforms that cause hangs
org.gradle.instrumentation.agent=false
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false# Timeout settings
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
