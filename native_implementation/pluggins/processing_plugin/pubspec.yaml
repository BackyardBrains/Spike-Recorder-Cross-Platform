name: processing_plugin
description: A Flutter FFI plugin for processing audio data
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: ProcessingPlugin
        ffiPlugin: true
      windows:
        pluginClass: ProcessingPlugin
        ffiPlugin: true 