			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Path to app's Frameworks directory\nAPP_FRAMEWORKS=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Frameworks\"\nmkdir -p \"${APP_FRAMEWORKS}\"\n\n# Path to plugin's lib directory\nPLUGIN_LIB_DIR=\"${PROJECT_DIR}/../native_implementation/pluggins/nwbfile_plugin/macos/Classes/lib\"\n\n# Copy HDF5 dylibs to app bundle\nif [ -d \"${PLUGIN_LIB_DIR}\" ]; then\n  echo \"Copying HDF5 libraries to app bundle...\"\n  cp -f \"${PLUGIN_LIB_DIR}/libhdf5.310.dylib\" \"${APP_FRAMEWORKS}/\" 2>/dev/null || true\n  cp -f \"${PLUGIN_LIB_DIR}/libhdf5_cpp.310.dylib\" \"${APP_FRAMEWORKS}/\" 2>/dev/null || true\n  cp -f \"${PLUGIN_LIB_DIR}/libsz.2.dylib\" \"${APP_FRAMEWORKS}/\" 2>/dev/null || true\n  cp -f \"${PLUGIN_LIB_DIR}/libaec.0.dylib\" \"${APP_FRAMEWORKS}/\" 2>/dev/null || true\n  \n  # Fix install names in copied dylibs to use @rpath\n  for dylib in \"${APP_FRAMEWORKS}\"/libhdf5*.dylib \"${APP_FRAMEWORKS}\"/libsz*.dylib \"${APP_FRAMEWORKS}\"/libaec*.dylib; do\n    if [ -f \"${dylib}\" ]; then\n      dylib_name=$(basename \"${dylib}\")\n      install_name_tool -id \"@rpath/${dylib_name}\" \"${dylib}\" 2>/dev/null || true\n      \n      # Fix dependencies within dylibs\n      install_name_tool -change \"/opt/homebrew/opt/hdf5/lib/libhdf5.310.dylib\" \"@rpath/libhdf5.310.dylib\" \"${dylib}\" 2>/dev/null || true\n      install_name_tool -change \"/opt/homebrew/opt/libaec/lib/libsz.2.dylib\" \"@rpath/libsz.2.dylib\" \"${dylib}\" 2>/dev/null || true\n      install_name_tool -change \"/opt/homebrew/opt/libaec/lib/libaec.0.dylib\" \"@rpath/libaec.0.dylib\" \"${dylib}\" 2>/dev/null || true\n      \n      # Re-sign the dylib after modification (ad-hoc signature)\n      codesign --force --sign - \"${dylib}\" 2>/dev/null || true\n    fi\n  done\n  \n  # Fix nwbfile_plugin framework's library paths AFTER frameworks are embedded\n  # Try multiple possible framework paths\n  FRAMEWORK_PATHS=(\n    \"${APP_FRAMEWORKS}/nwbfile_plugin.framework/nwbfile_plugin\"\n    \"${APP_FRAMEWORKS}/nwbfile_plugin.framework/Versions/A/nwbfile_plugin\"\n  )\n  \n  for FRAMEWORK_PATH in \"${FRAMEWORK_PATHS[@]}\"; do\n    if [ -f \"${FRAMEWORK_PATH}\" ]; then\n      echo \"Fixing nwbfile_plugin framework library paths at ${FRAMEWORK_PATH}...\"\n      FRAMEWORK_DIR=$(dirname \"${FRAMEWORK_PATH}\")\n      \n      # Remove code signature first to allow modification\n      codesign --remove-signature \"${FRAMEWORK_PATH}\" 2>/dev/null || true\n      \n      # Fix libhdf5.310.dylib path - try both exact path and pattern matching\n      OLD_HDF5_PATH=$(otool -L \"${FRAMEWORK_PATH}\" 2>/dev/null | grep -E \"/opt/homebrew.*libhdf5.310.dylib\" | awk '{print $1}' | head -1)\n      if [ -n \"${OLD_HDF5_PATH}\" ]; then\n        echo \"  Changing ${OLD_HDF5_PATH} to @rpath/libhdf5.310.dylib\"\n        install_name_tool -change \"${OLD_HDF5_PATH}\" \"@rpath/libhdf5.310.dylib\" \"${FRAMEWORK_PATH}\" || echo \"  ERROR: Failed to change libhdf5.310.dylib path\"\n      else\n        echo \"  WARNING: Could not find libhdf5.310.dylib path in framework\"\n      fi\n      \n      # Fix libhdf5_cpp.310.dylib path\n      OLD_HDF5_CPP_PATH=$(otool -L \"${FRAMEWORK_PATH}\" 2>/dev/null | grep -E \"/opt/homebrew.*libhdf5_cpp\" | awk '{print $1}' | head -1)\n      if [ -n \"${OLD_HDF5_CPP_PATH}\" ]; then\n        echo \"  Changing ${OLD_HDF5_CPP_PATH} to @rpath/libhdf5_cpp.310.dylib\"\n        install_name_tool -change \"${OLD_HDF5_CPP_PATH}\" \"@rpath/libhdf5_cpp.310.dylib\" \"${FRAMEWORK_PATH}\" || echo \"  ERROR: Failed to change libhdf5_cpp.310.dylib path\"\n      else\n        echo \"  WARNING: Could not find libhdf5_cpp.310.dylib path in framework\"\n      fi\n      \n      # Ensure rpath is set\n      install_name_tool -add_rpath \"@loader_path/../Frameworks\" \"${FRAMEWORK_PATH}\" 2>/dev/null || true\n      \n      # Re-sign the framework after modification (ad-hoc signature)\n      codesign --force --sign - \"${FRAMEWORK_PATH}\" 2>/dev/null || true\n      codesign --force --sign - \"${FRAMEWORK_DIR}\" 2>/dev/null || true\n      \n      # Verify the changes\n      echo \"  Verifying changes...\"\n      otool -L \"${FRAMEWORK_PATH}\" 2>/dev/null | grep -E \"libhdf5\" | head -2\n      \n      break\n    else\n      echo \"  WARNING: Framework not found at ${FRAMEWORK_PATH}\"\n    fi\n  done\n  \n  echo \"HDF5 libraries setup completed\"\nfi\n";
		};
